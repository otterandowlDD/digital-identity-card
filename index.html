let L="en",cur=0,topics=new Set();
const $=id=>document.getElementById(id), T=k=>UI[L][k];
function render(){
 document.documentElement.lang=L;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
 $("bEN").classList.toggle("on",L=="en");$("bTH").classList.toggle("on",L=="th");
 $("cards").innerHTML=B.map((b,i)=>`<button class="bc" role="tab" aria-selected="${i==cur}" data-k="${i}"><div class="n">0${i+1}</div><h3>${b[L].name}</h3><span class="t">${b[L].tag}</span></button>`).join("");
 const b=B[cur],x=b[L],qs=x.q.concat([[T("gen"),T("gena")]]);
 $("panel").innerHTML=`<div class="eyebrow">0${cur+1} / 05</div><h3>${x.name}</h3><div class="sub">${x.tag}</div><p style="margin:0">${x.d}</p>
 ${b.en.note?`<div class="note">${x.note}</div>`:""}
 <div class="lbl">${T("what")}</div><ul>${x.o.map(o=>`<li>${o}</li>`).join("")}</ul>
 <div class="lbl">${T("ask")}</div><div class="qs">${qs.map((q,i)=>`<div><button class="q" aria-expanded="false" style="width:100%">${q[0]}</button><div class="a">${q[1]}</div></div>`).join("")}</div>
 <div class="lbl">${T("bridge")}</div><a class="btn" href="https://line.me/ti/p/H8ScRo0nJT" target="_blank" rel="noopener">${T("talk")}</a>`;
 $("chips").innerHTML=B.map((b,i)=>`<button type="button" class="chip" aria-pressed="${topics.has(i)}" data-t="${i}">${b[L].name.split(" (")[0]}</button>`).join("")+`<button type="button" class="chip" aria-pressed="${topics.has(9)}" data-t="9">${L=="en"?"Partnership":"พันธมิตร"}</button>`;
 $("msg").placeholder=T("ph");
}
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-k]");if(c){cur=+c.dataset.k;render();$("panel").scrollIntoView({behavior:"smooth",block:"nearest"});return}
 const q=e.target.closest(".q");if(q){q.setAttribute("aria-expanded",q.getAttribute("aria-expanded")!="true");return}
 const t=e.target.closest("[data-t]");if(t){const k=+t.dataset.t;topics.has(k)?topics.delete(k):topics.add(k);render()}
});
$("bEN").onclick=()=>{L="en";render()};$("bTH").onclick=()=>{L="th";render()};
function draft(){
 const names=[...topics].map(k=>k==9?(L=="en"?"Partnership":"พันธมิตร"):B[k][L].name).join(", ")||T("gen2");
 return [T("hi"),$("nm").value?T("from")+$("nm").value:"",T("topic")+names,"",$("msg").value].filter((s,i)=>s||i==3).join("\n");
}
$("sendMail").onclick=()=>{location.href="mailto:k.hemngern@hotmail.com?subject="+encodeURIComponent("Enquiry via Meet Ning")+"&body="+encodeURIComponent(draft())};
$("sendLine").onclick=async()=>{
 try{await navigator.clipboard.writeText(draft());$("status").textContent=T("copied")}catch(_){$("status").textContent=T("copyfail")}
 window.open("https://line.me/ti/p/H8ScRo0nJT","_blank","noopener");
};
render();
</script>
